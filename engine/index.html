<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back to School Warm-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #000; --fg: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           font: 700 48px Fredoka, "Arial Rounded MT Bold", sans-serif; cursor: pointer; background: rgba(0,0,0,.55); }
</style>
<script>(function(){var q=new URLSearchParams(location.search);document.write('<script src="'+(q.get("tl")||"timeline.js")+'"><\/script>');})();</script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>(function(){var w=+new URLSearchParams(location.search).get("w");if(w){var c=document.getElementById("c");c.width=w;c.height=Math.round(w*9/16);}})();</script>
<div id="start">▶ Click to start (press F for full screen)</div>
<audio id="aud" src="audio.m4a" preload="auto"></audio>
<script>
const W = 1920, H = 1080, GROUND = 990;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TL = window.TIMELINE, BEAT = 60 / TL.bpm;
const FONT = '"Fredoka", "Arial Rounded MT Bold", "Arial Black", sans-serif';
{ const fl = (new URLSearchParams(location.search).get('flow') || '').split(',').filter(Boolean);
  TL.segments.forEach(s => { if (fl.includes(s.id) && s.scene !== 'card') s.scene = 'footage'; }); }
let acc = 0;
TL.segments.forEach(s => { s.start = acc; acc += s.dur; });
const TOTAL = acc;
window.TOTAL = TOTAL;

const D = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const frac = x => x - Math.floor(x);
// deterministic pseudo-random
const rnd = n => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);

function segAt(t) {
  for (let i = 0; i < TL.segments.length; i++) {
    const s = TL.segments[i];
    if (t < s.start + s.dur) return [s, i];
  }
  return [TL.segments[TL.segments.length - 1], TL.segments.length - 1];
}

/* ---------------- POSES ----------------
   Angles in degrees, "outward" positive (mirrored for screen-left side).
   0 = pointing down, 90 = horizontal outward, 180 = up. */
function basePose() {
  return { lean: 0, air: 0, squat: 0, wide: 4, dx: 0, kickL: 0, kickR: 0,
    armL: [10, 6], armR: [10, 6], liftL: 0, liftR: 0,
    legL: null, legR: null, mouth: 'smile', bounce: 0 };
}

function pose(move, st, b) {           // st = seconds into segment, b = beats into segment
  const p = basePose();
  const q2 = frac(b / 2), q1 = frac(b), q4 = frac(b / 4), q8 = frac(b / 8);
  switch (move) {
    case 'wave': {
      p.armR = [150, 150 + 28 * Math.sin(b * Math.PI * 2)];
      p.bounce = 8 * Math.abs(Math.sin(b * Math.PI));
      break;
    }
    case 'reach': {
      const up = ease(clamp(st / 1.2, 0, 1));
      const sway = Math.sin(b * Math.PI / 4);
      p.armL = [lerp(10, 165, up), lerp(6, 172, up)];
      p.armR = [lerp(10, 165, up), lerp(6, 172, up)];
      p.lean = st > 7 ? 14 * sway : 0;
      p.bounce = st <= 7 ? 10 * Math.abs(Math.sin(b * Math.PI / 2)) : 0;
      break;
    }
    case 'run': case 'highknees': {
      const big = move === 'highknees';
      const s = Math.sin(q1 * Math.PI * 2);
      p.liftL = Math.max(0, s) * (big ? 1 : 0.6);
      p.liftR = Math.max(0, -s) * (big ? 1 : 0.6);
      p.armL = [25, 25 - 115 * Math.max(0, -s)];
      p.armR = [25, 25 - 115 * Math.max(0, s)];
      p.bounce = (big ? 22 : 14) * Math.abs(s);
      p.mouth = 'open';
      break;
    }
    case 'jump': {
      // 2-beat cycle: crouch, fly (peak at q=0.5), land
      let air = 0, sq = 0;
      if (q2 < 0.2) sq = Math.sin(q2 / 0.2 * Math.PI / 2) * 0.55;
      else if (q2 < 0.8) { const k = (q2 - 0.2) / 0.6; air = Math.sin(k * Math.PI) * 125; sq = 0.1; }
      else sq = Math.sin((1 - (q2 - 0.8) / 0.2) * Math.PI / 2) * 0.45;
      p.air = air; p.squat = sq;
      const up = air / 125;
      p.armL = [lerp(30, 160, up), lerp(-20, 165, up)];
      p.armR = [lerp(30, 160, up), lerp(-20, 165, up)];
      p.liftL = p.liftR = 0.35 * up;
      p.mouth = air > 40 ? 'open' : 'smile';
      break;
    }
    case 'squat': {
      const s = (1 - Math.cos(q2 * Math.PI * 2)) / 2;
      p.squat = s; p.wide = 14;
      p.armL = [lerp(10, 88, s), lerp(6, 92, s)];
      p.armR = [lerp(10, 88, s), lerp(6, 92, s)];
      break;
    }
    case 'starjump': {
      const o = (1 - Math.cos(q1 * Math.PI * 2)) / 2;
      p.wide = lerp(4, 26, o);
      p.armL = [lerp(12, 150, o), lerp(8, 165, o)];
      p.armR = [lerp(12, 150, o), lerp(8, 165, o)];
      p.air = 45 * Math.abs(Math.sin(q1 * Math.PI * 2));
      p.mouth = 'open';
      break;
    }
    case 'freeze': {
      const frozen = q8 >= 0.5 && st >= 4;
      if (!frozen) {
        const w = Math.sin(b * Math.PI);
        p.armL = [120 + 30 * w, 150 - 40 * w];
        p.armR = [120 - 30 * w, 150 + 40 * w];
        p.lean = 10 * w; p.bounce = 14 * Math.abs(w); p.wide = 10;
      } else {
        p.armL = [95, 140]; p.armR = [60, -40]; p.liftR = 0.7; p.lean = -6; p.mouth = 'o';
      }
      break;
    }
    case 'reachside': {
      // 4-beat cycle: left (screen-left) then right
      if (st < 4) { p.wide = 14; p.armL = [60, -50]; p.armR = [60, -50]; break; }
      const left = q4 < 0.5;
      const k = Math.sin(frac(q4 * 2) * Math.PI);
      p.wide = 16;
      p.lean = (left ? -1 : 1) * 24 * k;
      const reach = [lerp(60, 150, k), lerp(-50, 155, k)];
      const hip = [60, -50];
      if (left) { p.armL = reach; p.armR = hip; } else { p.armR = reach; p.armL = hip; }
      break;
    }
    case 'frog': {
      // 4-beat cycle: sink 0-0.45, launch 0.45-0.8, land 0.8-1
      let sq = 0, air = 0, hands = 0;
      if (q4 < 0.45) { sq = ease(q4 / 0.45); hands = sq; }
      else if (q4 < 0.8) { const k = (q4 - 0.45) / 0.35; air = Math.sin(k * Math.PI) * 135; sq = 0.15; }
      else { sq = Math.sin((q4 - 0.8) / 0.2 * Math.PI) * 0.5; }
      p.squat = sq; p.air = air; p.wide = 16;
      const up = air / 135;
      p.armL = [lerp(lerp(10, 18, hands), 165, up), lerp(lerp(6, -8, hands), 170, up)];
      p.armR = [lerp(lerp(10, 18, hands), 165, up), lerp(lerp(6, -8, hands), 170, up)];
      p.mouth = air > 40 ? 'open' : 'smile';
      break;
    }
    case 'hop': {
      const s = Math.sin(q1 * Math.PI);
      p.air = 55 * s; p.squat = 0.22 * (1 - s);
      const odd = Math.floor(b) % 2;
      if (st >= 4) { if (odd) p.liftL = 0.55 * s; else p.liftR = 0.55 * s; }
      p.armL = [35, -35]; p.armR = [35, -35];
      p.mouth = 'open';
      break;
    }
    case 'tuckjump': {
      let air = 0, sq = 0;
      if (q2 < 0.2) sq = Math.sin(q2 / 0.2 * Math.PI / 2) * 0.55;
      else if (q2 < 0.8) { const k = (q2 - 0.2) / 0.6; air = Math.sin(k * Math.PI) * 125; sq = 0.05; }
      else sq = Math.sin((1 - (q2 - 0.8) / 0.2) * Math.PI / 2) * 0.45;
      const up = air / 125;
      p.air = air; p.squat = sq;
      p.liftL = p.liftR = 0.85 * up;
      p.armL = [lerp(30, 165, up), lerp(-20, 170, up)];
      p.armR = [lerp(30, 165, up), lerp(-20, 170, up)];
      p.mouth = air > 40 ? 'open' : 'smile';
      break;
    }
    case 'balance': {
      const leftUp = frac(b / 16) < 0.5;
      const k = ease(clamp(frac(b / 8) * 8 / 1.2, 0, 1));
      if (leftUp) p.liftL = 0.75 * k; else p.liftR = 0.75 * k;
      p.armL = [88, 95]; p.armR = [88, 95];
      p.lean = 4 * Math.sin(st * 2.3) + 2 * Math.sin(st * 5.1);
      break;
    }
    case 'kick': {
      const leftK = q2 < 0.5, k = Math.sin(frac(q2 * 2) * Math.PI);
      if (leftK) { p.kickL = 62 * k; p.lean = 12 * k; } else { p.kickR = 62 * k; p.lean = -12 * k; }
      p.armL = [40, -120]; p.armR = [40, -120];
      p.mouth = k > 0.6 ? 'open' : 'smile';
      break;
    }
    case 'skater': {
      p.dx = -230 * Math.cos(q2 * Math.PI * 2);
      const mv = Math.sin(q2 * Math.PI * 2);           // + moving right
      p.air = 60 * Math.abs(mv);
      p.squat = 0.35 * (1 - Math.abs(mv));
      p.lean = 12 * mv;
      if (p.dx < 0) p.liftR = 0.5 * (1 - Math.abs(mv)); else p.liftL = 0.5 * (1 - Math.abs(mv));
      p.armL = [50 + 40 * mv, 40 * mv]; p.armR = [50 - 40 * mv, -40 * mv];
      p.wide = 8;
      break;
    }
    case 'punch': {
      const leftP = q1 < 0.5, k = Math.pow(Math.sin(frac(q1 * 2) * Math.PI), 0.6);
      const guard = [35, -125], out = [lerp(35, 88, k), lerp(-125, 90, k)];
      if (leftP) { p.armL = out; p.armR = guard; p.lean = -6 * k; } else { p.armR = out; p.armL = guard; p.lean = 6 * k; }
      p.wide = 14; p.squat = 0.12; p.bounce = 6 * Math.abs(Math.sin(b * Math.PI));
      p.mouth = 'open';
      break;
    }
    case 'fly': {
      p.armL = [92, 96]; p.armR = [92, 96];
      p.lean = 16 * Math.sin(b * Math.PI / 4);
      p.air = 18 + 10 * Math.sin(b * Math.PI);
      p.liftL = p.liftR = 0.15;
      break;
    }
    case 'climb': {
      const s = Math.sin(q1 * Math.PI * 2);
      const a = Math.max(0, s), c = Math.max(0, -s);
      p.armL = [lerp(120, 168, a), lerp(150, 178, a)];
      p.armR = [lerp(120, 168, c), lerp(150, 178, c)];
      p.liftR = 0.7 * a; p.liftL = 0.7 * c;
      p.bounce = 8 * Math.abs(s);
      break;
    }
    case 'armcircles': {
      const dirn = st < 10 ? 1 : -1, w = dirn * q1 * Math.PI * 2;
      p.armL = [88 + 14 * Math.sin(w), 92 + 18 * Math.cos(w)];
      p.armR = [88 + 14 * Math.sin(w), 92 + 18 * Math.cos(w)];
      break;
    }
    case 'toetouch': {
      const k = (1 - Math.cos(q8 * Math.PI * 2)) / 2;
      p.squat = 0.78 * k; p.wide = 8;
      p.armL = [lerp(10, 2, k), lerp(6, -8, k)]; p.armR = [lerp(10, 2, k), lerp(6, -8, k)];
      break;
    }
    case 'sidestretch': {
      const leftS = frac(b / 16) < 0.5;
      const k = ease(clamp(frac(b / 8) * 8 / 2, 0, 1));
      p.wide = 12;
      p.lean = (leftS ? -1 : 1) * 22 * k;
      const over = [lerp(10, 160, k), lerp(6, 150, k)], hip = [lerp(10, 40, k), lerp(6, -60, k)];
      if (leftS) { p.armR = over; p.armL = hip; } else { p.armL = over; p.armR = hip; }
      break;
    }
    case 'rest': {
      const s = Math.sin(b * Math.PI / 2);
      p.liftL = 0.22 * Math.max(0, s); p.liftR = 0.22 * Math.max(0, -s);
      p.armR = [25, -150];   // hand to mouth (drinking)
      break;
    }
    case 'breathe': {
      const k = (1 - Math.cos(q8 * Math.PI * 2)) / 2;
      p.armL = [lerp(10, 168, k), lerp(6, 175, k)];
      p.armR = [lerp(10, 168, k), lerp(6, 175, k)];
      p.mouth = k > 0.5 ? 'o' : 'smile';
      break;
    }
  }
  return p;
}

/* ---------------- CHARACTER (cute chibi kid) ---------------- */
const C = { skin: '#D99A66', skinDark: '#B97A48', shirt: '#FF7A1A', shirtDark: '#E0600A', collar: '#FFFFFF',
            shorts: '#2E6BFF', shoe: '#FF4D6D', sole: '#FFFFFF', hair: '#2B1D16', hairHi: '#4A3427', line: '#2A1A10',
            bag: '#FFD23F', bagDark: '#E0AE10', cheek: 'rgba(255,105,120,0.55)', eye: '#24160F' };
const L = { torso: 128, ua: 78, fa: 74, thigh: 96, shin: 90, head: 98, sh: 44, hipW: 24 };

function dir(deg, side) { const a = deg * D; return [Math.sin(a) * side, Math.cos(a)]; }

function drawKid(cx, p, scale, t) {
  function leg(side, lift) {
    const sq = p.squat, kick = side < 0 ? p.kickL : p.kickR;
    const ta = p.wide + 48 * sq + kick, sa = p.wide * 0.6 - 6 * sq + kick * 1.1;
    const tLen = L.thigh * (1 - 0.38 * sq) * (1 - 0.62 * lift);
    const sLen = L.shin * (1 - 0.1 * sq) * (1 - 0.15 * lift);
    const hip = [side * L.hipW, 0];
    const d1 = dir(ta, side), d2 = dir(sa, side);
    const knee = [hip[0] + d1[0] * tLen, hip[1] + d1[1] * tLen];
    const foot = [knee[0] + d2[0] * sLen, knee[1] + d2[1] * sLen];
    return { hip, knee, foot };
  }
  const lg = [leg(-1, p.liftL), leg(1, p.liftR)];
  const lowest = Math.max(lg[0].foot[1], lg[1].foot[1]);
  const hipY = GROUND - 26 * scale - (lowest * scale) - p.air * scale - p.bounce * scale;

  ctx.save();
  ctx.translate(cx, hipY);
  ctx.scale(scale, scale);

  // shadow
  ctx.save();
  ctx.translate(0, (GROUND - hipY) / scale);
  const sh = clamp(1 - p.air / 260, 0.35, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, 115 * sh, 20 * sh, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const stroke = (pts, w, col) => {
    ctx.strokeStyle = C.line; ctx.lineWidth = w + 10;
    ctx.beginPath(); ctx.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]); ctx.stroke();
  };
  const blob = (x, y, rx, ry, col, lw = 6) => {
    ctx.fillStyle = C.line; ctx.beginPath(); ctx.ellipse(x, y, rx + lw, ry + lw, 0, 0, 7); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  };
  // legs + sneakers
  for (const g of lg) {
    const sx = Math.sign(g.hip[0]);
    stroke([g.knee, g.foot], 32, C.skin);
    stroke([g.hip, g.knee], 44, C.shorts);
    blob(g.foot[0] + sx * 10, g.foot[1] + 8, 36, 22, C.shoe);
    ctx.fillStyle = C.sole; ctx.beginPath(); ctx.ellipse(g.foot[0] + sx * 10, g.foot[1] + 20, 34, 8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(g.foot[0] + sx * 18, g.foot[1] + 2, 6, 0, 7); ctx.fill();
  }
  // shorts
  ctx.fillStyle = C.line; roundRect(-L.hipW - 34, -26, (L.hipW + 34) * 2, 56, 20); ctx.fill();
  ctx.fillStyle = C.shorts; roundRect(-L.hipW - 29, -21, (L.hipW + 29) * 2, 46, 16); ctx.fill();

  // upper body rotated by lean
  ctx.rotate(p.lean * D);
  const neck = [0, -L.torso];
  // backpack peeking out behind the body
  ctx.fillStyle = C.line; roundRect(-84, -L.torso + 2, 168, 118, 34); ctx.fill();
  ctx.fillStyle = C.bag; roundRect(-78, -L.torso + 8, 156, 106, 30); ctx.fill();
  // torso (rounded, a bit pear-shaped)
  ctx.fillStyle = C.line; roundRect(-64, -L.torso - 12, 128, L.torso + 18, 46); ctx.fill();
  ctx.fillStyle = C.shirt; roundRect(-58, -L.torso - 6, 116, L.torso + 6, 40); ctx.fill();
  ctx.fillStyle = C.shirtDark; roundRect(-58, -22, 116, 14, 6); ctx.fill();
  // backpack straps
  ctx.strokeStyle = C.bagDark; ctx.lineWidth = 12;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 34, -L.torso - 2); ctx.lineTo(s * 40, -L.torso * 0.25); ctx.stroke(); }
  // collar
  ctx.fillStyle = C.collar;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(0, -L.torso - 4); ctx.lineTo(s * 30, -L.torso - 6); ctx.lineTo(s * 14, -L.torso + 16); ctx.closePath(); ctx.fill(); }
  drawStar(0, -L.torso * 0.48, 24, 11, '#FFE14D', C.line);
  // arms
  for (const side of [-1, 1]) {
    const a = side < 0 ? p.armL : p.armR;
    const s0 = [side * L.sh, neck[1] + 16];
    const d1 = dir(a[0], side), d2 = dir(a[1], side);
    const el = [s0[0] + d1[0] * L.ua, s0[1] + d1[1] * L.ua];
    const hd = [el[0] + d2[0] * L.fa, el[1] + d2[1] * L.fa];
    stroke([el, hd], 28, C.skin);
    stroke([s0, el], 36, C.shirt);
    blob(hd[0], hd[1], 19, 19, C.skin, 5);
  }
  // ---- big cute head ----
  const R = L.head, hy = neck[1] - R + 22;
  // ears
  for (const s of [-1, 1]) blob(s * (R * 1.02), hy + 12, 16, 20, C.skin, 5);
  blob(0, hy, R * 1.06, R * 0.96, C.skin, 7);
  // hair cap + fringe
  ctx.fillStyle = C.hair;
  ctx.beginPath(); ctx.ellipse(0, hy - 14, R * 1.1, R * 0.86, 0, Math.PI * 1.0, Math.PI * 2.0); ctx.fill();
  for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.ellipse(i * 27, hy - 36 + Math.abs(i) * 4, 26, 22, 0, 0, Math.PI); ctx.fill(); }
  ctx.fillStyle = C.hairHi; ctx.beginPath(); ctx.ellipse(-36, hy - R * 0.62, 26, 9, -0.35, 0, 7); ctx.fill();
  // springy hair curl on top (bounces with movement)
  const spring = Math.sin(t * 9) * 0.25 + (p.air + p.bounce) * 0.004;
  ctx.save(); ctx.translate(6, hy - R * 0.86); ctx.rotate(spring);
  ctx.strokeStyle = C.hair; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-6, -40, 34, -52, 30, -24); ctx.stroke(); ctx.restore();
  // eyes
  const blink = frac(t / 3.7) < 0.035, ey = hy + 14;
  for (const s of [-1, 1]) {
    const ex = s * 34;
    if (blink || p.mouth === 'squint') {
      ctx.strokeStyle = C.eye; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(ex, ey + 4, 13, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else {
      ctx.fillStyle = C.eye; ctx.beginPath(); ctx.ellipse(ex, ey, 15, 20, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#5B3A22'; ctx.beginPath(); ctx.ellipse(ex, ey + 7, 10, 10, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + 5, ey - 7, 6.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(ex - 5, ey + 7, 3, 0, 7); ctx.fill();
    }
    // eyebrows
    ctx.strokeStyle = C.hair; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(ex, ey - 22, 14, Math.PI * 1.25, Math.PI * 1.75); ctx.stroke();
  }
  // rosy cheeks
  ctx.fillStyle = C.cheek;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 60, hy + 40, 17, 11, 0, 0, 7); ctx.fill(); }
  // nose
  ctx.fillStyle = C.skinDark; ctx.beginPath(); ctx.ellipse(0, hy + 32, 6, 4, 0, 0, 7); ctx.fill();
  // mouth
  ctx.strokeStyle = C.line; ctx.lineWidth = 5;
  const my = hy + 48;
  if (p.mouth === 'open') {
    ctx.fillStyle = '#7A1E1E'; ctx.beginPath(); ctx.moveTo(-18, my - 4); ctx.quadraticCurveTo(0, my + 30, 18, my - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FF7A8A'; ctx.beginPath(); ctx.ellipse(0, my + 10, 9, 5, 0, 0, 7); ctx.fill();
  } else if (p.mouth === 'o') {
    ctx.fillStyle = '#7A1E1E'; ctx.beginPath(); ctx.ellipse(0, my + 4, 9, 11, 0, 0, 7); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-16, my - 2); ctx.quadraticCurveTo(-8, my + 8, 0, my); ctx.quadraticCurveTo(8, my + 8, 16, my - 2); ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- HANA (original kawaii anime-style girl) ---------------- */

      ctx.save(); ctx.translate(1660, 330);
      ctx.fillStyle = '#222'; roundRect(-75, -170, 150, 340, 30); ctx.fill(); ctx.fillRect(-12, 170, 24, GROUND - 500);
      ctx.fillStyle = red ? '#FF2E2E' : '#4A1515'; ctx.beginPath(); ctx.arc(0, -85, 52, 0, 7); ctx.fill();
      ctx.fillStyle = red ? '#173D17' : '#33FF66'; ctx.beginPath(); ctx.arc(0, 75, 52, 0, 7); ctx.fill();
      ctx.restore();
      break;
    }
    case 'hopscotch': {
      const cells = [[-1, 0], [1, 0], [0, 1], [-1, 2], [1, 2], [0, 3]];
      ctx.save(); ctx.globalAlpha = 0.9; ctx.lineWidth = 8; ctx.strokeStyle = '#fff';
      for (let i = 0; i < 6; i++) { const [cx, r] = cells[i]; ctx.strokeRect(KX + cx * 150 - 75 + (cx === 0 ? 0 : 0), GROUND + 6 + r * 0, 150, 70); }
      const active = Math.floor(b) % 6, [ax] = cells[active];
      ctx.fillStyle = 'rgba(255,225,77,0.6)'; ctx.fillRect(KX + ax * 150 - 75, GROUND + 6, 150, 70);
      ctx.restore();
      break;
    }
    case 'lasers': {
      const q2 = frac(b / 2), side = q2 < 0.5 ? 1 : -1;  // laser on the side the kid is leaving
      const a = Math.sin(frac(q2 * 2) * Math.PI);
      ctx.save(); ctx.globalAlpha = 0.35 + 0.6 * a; ctx.strokeStyle = '#FF2E6A'; ctx.lineWidth = 26; ctx.shadowColor = '#FF2E6A'; ctx.shadowBlur = 40;
      const x = KX - side * 230;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GROUND); ctx.stroke(); ctx.restore();
      break;
    }
  }
}
function beatDots(b, seg) {
  if (seg.scene === 'card') return;
  const n = Math.floor(b) % 4, p = Math.pow(1 - frac(b), 2);
  for (let i = 0; i < 4; i++) {
    const on = i === n;
    ctx.fillStyle = on ? '#FFE14D' : 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(90 + i * 56, H - 92, on ? 18 + 8 * p : 14, 0, 7); ctx.fill();
  }
}

/* ---------------- HUD ---------------- */
function textOut(txt, x, y, size, fill, line, lw, align = 'center') {
  ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = lw; ctx.strokeStyle = line; ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
  ctx.textAlign = 'left';
}
function hud(t, seg, idx, st, b) {
  if (seg.scene === 'card') return;
  const pulse = Math.pow(1 - frac(b), 3);
  const intro = ease(clamp(st / 0.5, 0, 1));
  // cue
  ctx.save(); ctx.translate(W / 2, 150); const sc = (0.6 + 0.4 * intro) * (1 + 0.04 * pulse); ctx.scale(sc, sc);
  ctx.font = `700 118px ${FONT}`; const cw = ctx.measureText(seg.cue).width; if (cw > 1380) ctx.scale(1380 / cw, 1380 / cw);
  textOut(seg.cue, 0, 0, 118, '#FFE14D', '#1B1B3A', 22);
  ctx.restore();
  // story
  if (st < 6.5) {
    ctx.globalAlpha = intro * clamp((6.5 - st) / 0.5, 0, 1);
    ctx.font = `500 48px ${FONT}`; const w = ctx.measureText(seg.story).width + 70;
    ctx.fillStyle = 'rgba(27,27,58,0.78)'; roundRect(W / 2 - w / 2, 192, w, 76, 38); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(seg.story, W / 2, 246); ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
  if (seg.jp && st >= 6.5) {
    ctx.globalAlpha = clamp((st - 6.5) / 0.5, 0, 1);
    ctx.font = `700 50px ${FONT}`; const w = ctx.measureText(seg.jp).width + 70;
    ctx.fillStyle = 'rgba(255,79,140,0.88)'; roundRect(W / 2 - w / 2, 192, w, 76, 38); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(seg.jp, W / 2, 248); ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
  // freeze / dance big word
  if (seg.move === 'freeze' && st >= 4) {
    const frozen = frac(b / 8) >= 0.5;
    const k = 1 + 0.12 * Math.pow(1 - frac(b / 4), 4);
    const light = seg.prop === 'light';
    ctx.save(); ctx.translate(light || frozen ? 470 : 1520, 560); ctx.scale(k, k); ctx.rotate(frozen ? -0.08 : 0.08);
    const word = light ? (frozen ? (seg.id === 'statue' ? 'HERO POSE!' : 'RED: FREEZE!') : 'GREEN: GO!') : (frozen ? 'FREEZE!' : 'DANCE!');
    textOut(word, 0, 0, light ? 100 : 150, frozen ? (light ? '#FF5A5A' : '#7FDBFF') : (light ? '#4DFF9A' : '#FF4D9D'), '#1B1B3A', 24);
    ctx.restore();
  }
  // timer ring
  if (seg.id !== 'intro' && seg.id !== 'outro') {
    const left = Math.max(0, seg.dur - st), k = st / seg.dur;
    ctx.fillStyle = 'rgba(27,27,58,0.8)'; ctx.beginPath(); ctx.arc(W - 120, 120, 78, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3A3F7A'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(W - 120, 120, 62, 0, 7); ctx.stroke();
    ctx.strokeStyle = left <= 4 ? '#FF4D6D' : '#4DFF9A'; ctx.beginPath(); ctx.arc(W - 120, 120, 62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k)); ctx.stroke();
    textOut(String(Math.ceil(left)), W - 120, 142, 62, '#fff', '#1B1B3A', 6);
  }
  // NEXT banner
  const next = TL.segments[idx + 1];
  if (next && next.id !== 'outro' && st > seg.dur - 4) {
    const k = ease(clamp((st - (seg.dur - 4)) / 0.4, 0, 1));
    const y = lerp(H + 60, H - 150, k);
    ctx.fillStyle = 'rgba(27,27,58,0.9)'; roundRect(W / 2 - 430, y - 66, 860, 100, 50); ctx.fill();
    textOut('NEXT: ' + next.cue + '  ▶', W / 2, y + 4, 56, '#4DFF9A', '#1B1B3A', 6);
  }
  // progress bar
  const pk = t / TOTAL;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(60, H - 44, W - 120, 18, 9); ctx.fill();
  ctx.fillStyle = '#FFE14D'; roundRect(60, H - 44, Math.max(18, (W - 120) * pk), 18, 9); ctx.fill();
  for (const s of TL.segments) if (s.scene === 'card') { const x = 60 + (W - 120) * s.start / TOTAL; ctx.fillStyle = '#1B1B3A'; ctx.fillRect(x - 3, H - 50, 6, 30); }
}

/* ---------------- FRAME ---------------- */
function renderAt(t) {
  t = clamp(t, 0, TOTAL - 1e-3);
  const [seg, idx] = segAt(t);
  const st = t - seg.start, b = st / BEAT;
  const S = cv.width / W;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const prev = idx > 0 ? TL.segments[idx - 1] : null;
  const XF = 0.6;                                   // crossfade length (s)
  if (prev && st < XF) {
    const keep = BG; BG = BG2;
    scene(prev.scene, t, prev.dur + st, (prev.dur + st) / BEAT, prev);
    BG = keep;
    ctx.globalAlpha = ease(st / XF);
    scene(seg.scene, t, st, b, seg);
    ctx.globalAlpha = 1;
  } else scene(seg.scene, t, st, b, seg);
  if (seg.scene !== 'card') {
    props(seg, t, st, b);
    let p = pose(seg.move, st, b);
    if (prev && prev.scene !== 'card' && st < 0.7) p = blendPose(pose(prev.move, prev.dur + st, (prev.dur + st) / BEAT), p, ease(st / 0.7));
    const ch = TL.character || 'line';
    if (ch === 'line') drawLine(KX + p.dx, p, 0.98, t);
    else (ch === 'hana' ? drawHana : drawKid)(KX + p.dx, p, 1.15, t);
  }
  if (TL.petals && seg.scene !== 'card') petals(t);
  hud(t, seg, idx, st, b);
  beatDots(b, seg);
  if (t < 0.6) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (t > TOTAL - 1) { ctx.fillStyle = `rgba(0,0,0,${t - (TOTAL - 1)})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;

/* ---------------- YOUTUBE CHAPTER CARDS (intro / outro around each chapter video) ---------------- */
function ytCard(kind, st, dur, ch, big, small, top) {
  const S = cv.width / W;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const seg = { start: 0, dur: dur, ch: ch };
  footageBG(seg, st, 0.5);
  const b = st / BEAT, k = ease(clamp(st / 0.6, 0, 1)), pulse = Math.pow(1 - frac(b), 3);
  if (kind === 'outro') confetti(st, st);
  ctx.save(); ctx.translate(W / 2 - 180, H / 2 - 40);
  const sc = lerp(1.5, 1, k) * (1 + 0.03 * pulse); ctx.scale(sc, sc); ctx.globalAlpha = k;
  if (top) {
    ctx.font = `700 64px ${FONT}`; const tw = Math.max(420, ctx.measureText(top).width + 110);
    ctx.fillStyle = CH_COL[ch][0]; roundRect(-tw / 2, -250, tw, 100, 50); ctx.fill();
    textOut(top, 0, -178, 64, '#fff', CH_COL[ch][0], 2);
  }
  ctx.font = `700 150px ${FONT}`; const bw = ctx.measureText(big).width, lim = 1250;
  if (bw > lim) { ctx.save(); ctx.scale(lim / bw, lim / bw); }
  textOut(big, 0, 40, 150, '#FFE14D', '#1B1B3A', 26);
  if (bw > lim) ctx.restore();
  textOut(small, 0, 170, 72, '#fff', '#1B1B3A', 14);
  ctx.restore();
  const p = pose('wave', st, b);
  drawLine(W - 330 + p.dx, p, 0.9, st);
  if (st < 0.3) { ctx.fillStyle = `rgba(0,0,0,${1 - st / 0.3})`; ctx.fillRect(0, 0, W, H); }
  if (kind === 'outro' && st > dur - 0.6) { ctx.fillStyle = `rgba(0,0,0,${(st - dur + 0.6) / 0.6})`; ctx.fillRect(0, 0, W, H); }
}
window.ytCardJPEG = async (kind, st, dur, ch, big, small, top, bg) => {
  if (bg !== undefined) { if (bg) await setBG(bg); else BG = null; }
  ytCard(kind, st, dur, ch, big, small, top); return cv.toDataURL('image/jpeg', 0.9);
};
window.frameJPEG = async (t, q, bg, bg2) => { if (bg !== undefined) { if (bg) await setBG(bg); else BG = null; } BG2 = bg2 ? await loadImg(bg2) : null; renderAt(t); return cv.toDataURL('image/jpeg', q || 0.92); };
window.SEGS = TL.segments.map(s => ({ id: s.id, start: s.start, dur: s.dur, clip: s.clip || null, clipStart: s.clipStart || 0 }));

/* ---------------- LIVE PLAYBACK ---------------- */
const params = new URLSearchParams(location.search);
const startEl = document.getElementById('start'), aud = document.getElementById('aud');
if (params.has('render')) { startEl.remove(); }
else {
  document.fonts.ready.then(() => renderAt(0.7));
  startEl.onclick = () => {
    startEl.remove();
    aud.currentTime = 0;
    const t0 = performance.now();
    aud.play().catch(() => {});
    const loop = () => {
      const t = (aud.readyState >= 2 && !aud.paused) ? aud.currentTime : (performance.now() - t0) / 1000;
      renderAt(t); if (t < TOTAL) requestAnimationFrame(loop);
    };
    loop();
  };
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.(); });
}
</script>
